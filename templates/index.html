<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Happy Birthday!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e6;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .page {
            display: none;
            animation: fadeIn 0.8s ease-in-out;
            width: 100%;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #e60000;
            transform: scale(1.05);
        }

        .from-text {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 14px;
            color: rgb(77, 27, 218);
            font-style: italic;
        }

        h1 {color: #ff4d4d; margin-bottom: 10px; }
        p {
            color: #555;
            font-size: 18px;
            line-height: 1.5;
        }
        .balloon {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="page active" id="page1">
           <div class="balloon">🎈🎂🎉🎉</div>
           <h1>Selamat Ulang Tahun,<br>{{ nama }}!</h1>
           <button class="btn" onclick="nextPage(2)">Lanjut</button>
        </div>

        <div class="page" id="page2">
            {% for baris in pesan %}
                <p>{{ baris }}</p>
            {% endfor %}
            <button class="btn" onclick="nextPage(3)">Lanjut</button>
        </div>

        <div class="page" id="page3">
            <h1>SELAMAT ULANG TAHUN AZZAHRA</h1>
            <div class="ballon">👏✨🎁</div>
            <button class="btn" onclick="nextPage(1)">Ulangi</button>

            <div class="from-text">From:FIT✌🏼</div>
        </div>
    </div>
    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById('page' + pageNumber).classList.add('active');
        }
    </script>
</body>
</html>
